    <script type="text/javascript">
      // Trik SPA GitHub Pages: baca path yang disimpan 404.html, lalu perbaiki URL
      // sebelum React mulai membaca window.location
      (function (l) {
        if (l.search[1] === "/") {
          var decoded = l.search.slice(1).split("&").map(function (s) {
            return s.replace(/~and~/g, "&");
          }).join("?");
          window.history.replaceState(
            null,
            null,
            l.pathname.slice(0, -1) + decoded + l.hash
          );
        }
      })(window.location);
    </script>
